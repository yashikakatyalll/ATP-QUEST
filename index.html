<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATP QUEST: Metabolic Mission</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100;300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root {
            --bg-deep: #020205;
            --atp-gold: #fbbf24;
            --nadh-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep);
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-y: auto !important;
            overflow-x: hidden;
            background-attachment: fixed;
        }

        .header-wrap {
            display: block;
            width: 100%;
            overflow: visible !important;
            padding: 0 0.8rem; /* Critical for italic text */
        }

        .text-hero {
            font-size: clamp(1.8rem, 6vw, 4.5rem);
            line-height: 1.1;
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
            display: inline-block;
            padding-right: 0.8em; 
            padding-bottom: 0.1em;
            overflow: visible !important;
        }

        .glass-panel {
            background: rgba(10, 10, 18, 0.98);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95);
        }

        .membrane-texture {
            background-image: 
                radial-gradient(circle at 50% 50%, #0a0a14 0%, #020205 100%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 10px);
        }

        .stage-container {
            min-height: calc(100vh - 112px);
            width: 100%;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            overflow: visible !important;
        }

        .btn-neural {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 0.15em;
            border-radius: 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn-neural:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            filter: brightness(1.2);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.3);
        }

        .formula { font-family: 'JetBrains Mono', monospace; }

        @keyframes pulse-organ {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0.6; }
        }
        .pulse-organ { animation: pulse-organ 2s infinite ease-in-out; }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; border: 3px solid #000; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="membrane-texture">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
